[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "valvuln-ai"
version = "0.1.0"
description = "Local report triage and controlled evidence review; text provider configured separately"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi==0.162.0", "uvicorn==0.54.0", "pydantic==2.14.2",
  "pydantic-settings==2.16.2", "aiosqlite==0.22.1", "pwdlib[argon2]==0.3.1",
  "python-multipart==0.0.33", "jinja2==3.1.6", "httpx==0.28.1",
]

[project.optional-dependencies]
test = ["pytest==9.2.0", "pytest-asyncio==1.4.1.post1"]

[tool.setuptools.packages.find]
include = ["app*", "boundary*", "worker*", "lab*", "evaluator*"]

[tool.setuptools.package-data]
app = ["storage/migrations/*.sql", "templates/*.html", "static/*"]
lab = ["migrations/*.sql", "manual.html"]
evaluator = ["catalog.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
